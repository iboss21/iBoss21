<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="LIKE A KING INC. · New York software company">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.6" stop-color="#120a0c"/>
      <stop offset="1" stop-color="#2a070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#c8161d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c8161d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f4f2ef; }
      .k { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; fill: #ff6b5e; letter-spacing: 3px; }
      .s { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #a6a6ab; }
      .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.16,1,.3,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .line { opacity: 0; animation: cycle 12s linear infinite; }
      .l2 { animation-delay: 4s } .l3 { animation-delay: 8s }
      @keyframes cycle { 0% { opacity: 0 } 3% { opacity: 1 } 30% { opacity: 1 } 33% { opacity: 0 } 100% { opacity: 0 } }
      .p { fill: #ff3b30; animation: drift 9s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translate(0,0); opacity: .25 } to { transform: translate(-40px,-26px); opacity: .9 } }
      .ring { fill: none; stroke: #c8161d; stroke-width: 1.4; opacity: .55; transform-origin: 930px 160px; animation: spin 40s linear infinite; }
      .ring2 { stroke-dasharray: 4 10; animation-duration: 70s; animation-direction: reverse; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { .rise, .line, .p, .ring { animation: none !important; opacity: 1 } .l2, .l3 { opacity: 0 } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <g>
    <circle class="ring" cx="930" cy="160" r="112"/>
    <circle class="ring ring2" cx="930" cy="160" r="138"/>
    <circle class="p" cx="880" cy="96" r="2.2" style="animation-delay:-1s"/>
    <circle class="p" cx="985" cy="120" r="1.6" style="animation-delay:-3s"/>
    <circle class="p" cx="1010" cy="214" r="2.4" style="animation-delay:-5s"/>
    <circle class="p" cx="860" cy="226" r="1.8" style="animation-delay:-2s"/>
    <circle class="p" cx="1060" cy="160" r="1.4" style="animation-delay:-7s"/>
    <circle class="p" cx="905" cy="270" r="1.6" style="animation-delay:-4s"/>
    <circle class="p" cx="1100" cy="96" r="1.2" style="animation-delay:-6s"/>
    <text x="930" y="150" text-anchor="middle" class="t" font-size="34" font-weight="700" letter-spacing="2">LAKI</text>
    <text x="930" y="182" text-anchor="middle" class="k" font-size="12">EST. NEW YORK</text>
  </g>
  <g transform="translate(64 0)">
    <text x="0" y="92" class="k rise d1" font-size="14">IBOSS · LIKE A KING INC.</text>
    <text x="0" y="150" class="t rise d2" font-size="48" font-weight="700">We build the web that moves</text>
    <g class="rise d3">
      <text x="0" y="200" class="s line" font-size="22">Websites, ordering systems and apps for real businesses.</text>
      <text x="0" y="200" class="s line l2" font-size="22">Reges: private, local-first AI that asks before it acts.</text>
      <text x="0" y="200" class="s line l3" font-size="22">Cinematic templates, roleplay frameworks, open-source tools.</text>
    </g>
    <text x="0" y="262" class="k rise d3" font-size="13">likeakinginc.com  ·  regescore.pro  ·  animatedwebs.com</text>
  </g>
</svg>
